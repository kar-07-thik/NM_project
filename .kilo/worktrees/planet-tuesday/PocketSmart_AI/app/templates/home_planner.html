{% extends "base.html" %}

{% block title %}Home Planner{% endblock %}

{% block content %}
<div class="planner-page container">
    <div class="planner-header text-center section-margin">
        <div class="planner-icon bg-home"><i class="fa-solid fa-house-chimney"></i></div>
        <h2>Home Interior Budget Planner</h2>
        <p>Optimize your home renovation budget with AI.</p>
    </div>
    
    <div class="planner-form-container glass-card">
        <form method="POST" action="{{ url_for('recommendations.home_planner') }}" id="planner-form">
            <div class="form-section">
                <h3>1. Total Budget</h3>
                <div class="form-group">
                    <label for="total_budget">Total Budget ($)</label>
                    <input type="number" id="total_budget" name="total_budget" min="100" step="0.01" required placeholder="e.g. 5000">
                </div>
            </div>
            
            <div class="form-section">
                <h3>2. Rooms to Include</h3>
                <div class="checkbox-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" name="rooms" value="Living Room" checked> Living Room
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="rooms" value="Bedroom"> Bedroom
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="rooms" value="Kitchen"> Kitchen
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="rooms" value="Bathroom"> Bathroom
                    </label>
                </div>
            </div>
            
            <div class="form-section">
                <h3>3. Fixtures & Furniture Count</h3>
                <div class="number-grid">
                    <div class="form-group">
                        <label for="lights"><i class="fa-regular fa-lightbulb"></i> Lights</label>
                        <input type="number" id="lights" name="lights" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="fans"><i class="fa-solid fa-fan"></i> Ceiling Fans</label>
                        <input type="number" id="fans" name="fans" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="furniture"><i class="fa-solid fa-couch"></i> Furniture Pieces</label>
                        <input type="number" id="furniture" name="furniture" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="dining"><i class="fa-solid fa-chair"></i> Dining Tables</label>
                        <input type="number" id="dining" name="dining" min="0" value="0">
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary large full-width" id="submit-btn">
                    Generate AI Recommendations <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
