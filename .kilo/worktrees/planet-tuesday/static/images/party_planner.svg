  <polygon points="190,68 215,115 240,68" fill="#10b981"/>
  <polygon points="260,55 285,100 310,55" fill="#3b82f6"/>
  <polygon points="330,55 355,100 380,55" fill="#8b5cf6"/>
  <polygon points="400,68 425,115 450,68" fill="#ec4899"/>
  <polygon points="470,68 495,115 520,68" fill="#06b6d4"/>

  <!-- Balloons Left Group -->
  <!-- Balloon Strings -->
