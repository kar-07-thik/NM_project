  <path d="M420 180 Q400 240 430 320" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M460 200 Q450 260 430 320" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M480 160 Q500 230 430 320" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <ellipse cx="420" cy="150" rx="36" ry="46" fill="#10b981"/>
  <polygon points="417,196 423,196 420,203" fill="#059669"/>

  <ellipse cx="480" cy="130" rx="38" ry="48" fill="#a855f7"/>
