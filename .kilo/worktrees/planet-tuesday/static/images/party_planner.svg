  <rect x="260" y="175" width="80" height="48" rx="6" fill="#f43f5e"/>
  <!-- Frosting swirls -->
  <path d="M260 185 Q270 195 280 185 Q290 195 300 185 Q310 195 320 185 Q330 195 340 185" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M245 230 Q260 242 275 230 Q290 242 305 230 Q320 242 335 230 Q350 242 355 230" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- Candle -->
  <rect x="296" y="145" width="8" height="30" fill="#3b82f6" rx="2"/>
