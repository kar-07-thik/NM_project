{% extends "base.html" %}

{% block title %}Jewelry Planner{% endblock %}

{% block content %}
<div class="planner-page container">
    <div class="planner-header text-center section-margin">
        <div class="planner-icon bg-jewelry"><i class="fa-solid fa-ring"></i></div>
        <h2>Jewelry Budget Planner</h2>
        <p>Upload your outfit, and let AI recommend the perfect jewelry.</p>
    </div>
    
    <div class="planner-form-container glass-card">
        <form method="POST" action="{{ url_for('recommendations.jewelry_planner') }}" enctype="multipart/form-data" id="planner-form">
            <div class="form-section">
                <h3>1. Budget</h3>
                <div class="form-group">
                    <label for="total_budget">Total Jewelry Budget ($)</label>
                    <input type="number" id="total_budget" name="total_budget" min="10" step="0.01" required placeholder="e.g. 200">
                </div>
            </div>
            
            <div class="form-section">
                <h3>2. Outfit Analysis</h3>
                <div class="form-group">
                    <label>Upload Outfit Image</label>
                    <div class="file-upload-wrapper" id="file-upload-wrapper">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Click to browse or drag and drop</p>
                        <span>PNG, JPG, JPEG, WEBP up to 5MB</span>
                        <input type="file" id="outfit_image" name="outfit_image" accept="image/*" required class="file-input">
                    </div>
                    <div id="image-preview" class="image-preview hidden">
                        <img id="preview-img" src="" alt="Preview">
                        <button type="button" id="remove-img" class="btn-outline small">Remove</button>
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary large full-width" id="submit-btn">
                    Analyze Outfit & Recommend <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
