{% extends "base.html" %}

{% block title %}Party Planner{% endblock %}

{% block content %}
<div class="planner-page container">
    <div class="planner-header text-center section-margin">
        <div class="planner-icon bg-party"><i class="fa-solid fa-champagne-glasses"></i></div>
        <h2>Party Budget Planner</h2>
        <p>Allocate funds perfectly for your next big event.</p>
    </div>
    
    <div class="planner-form-container glass-card">
        <form method="POST" action="{{ url_for('recommendations.party_planner') }}" id="planner-form">
            <div class="form-section">
                <h3>1. Budget & Guests</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="total_budget">Total Budget ($)</label>
                        <input type="number" id="total_budget" name="total_budget" min="50" step="0.01" required placeholder="e.g. 1000">
                    </div>
                    <div class="form-group">
                        <label for="guest_count">Number of Guests</label>
                        <input type="number" id="guest_count" name="guest_count" min="1" required placeholder="e.g. 50">
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <h3>2. Event Details</h3>
                <div class="form-group">
                    <label for="event_type">Type of Event</label>
                    <select id="event_type" name="event_type" class="form-select" required>
                        <option value="" disabled selected>Select event type</option>
                        <option value="Birthday Party">Birthday Party</option>
                        <option value="Wedding Reception">Wedding Reception</option>
                        <option value="Corporate Event">Corporate Event</option>
                        <option value="Dinner Party">Dinner Party</option>
                        <option value="Anniversary">Anniversary</option>
                    </select>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary large full-width" id="submit-btn">
                    Generate AI Recommendations <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
