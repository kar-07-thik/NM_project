<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="jewelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="boxVelvet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="350" fill="url(#jewelBg)"/>

  <!-- Velvet Jewelry Display Box -->
  <ellipse cx="300" cy="230" rx="160" ry="85" fill="#3f0012" opacity="0.25"/>
  <rect x="150" y="140" width="300" height="130" rx="20" fill="url(#boxVelvet)" stroke="#9f1239" stroke-width="3"/>
  <!-- Box Interior Cushion -->
  <rect x="165" y="155" width="270" height="100" rx="14" fill="#9f1239"/>

  <!-- Golden Necklace Chain around cushion -->
  <path d="M 210 180 Q 300 245 390 180" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- Necklace Pearl / Gem drops -->
  <circle cx="240" cy="200" r="7" fill="url(#diamond)" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="270" cy="216" r="8" fill="url(#diamond)" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="300" cy="222" r="10" fill="url(#diamond)" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="330" cy="216" r="8" fill="url(#diamond)" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="360" cy="200" r="7" fill="url(#diamond)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Sparkle stars around gem -->
  <path d="M300 240 L303 248 L311 251 L303 254 L300 262 L297 254 L289 251 L297 248 Z" fill="#fde047"/>
  <path d="M420 110 L423 118 L431 121 L423 124 L420 132 L417 124 L409 121 L417 118 Z" fill="#fde047"/>
  <path d="M170 110 L173 116 L179 118 L173 120 L170 126 L167 120 L161 118 L167 116 Z" fill="#fde047"/>

  <!-- Floating Large Diamond Ring -->
  <g transform="translate(300, 95)">
    <!-- Ring Band -->
    <ellipse cx="0" cy="25" rx="35" ry="18" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <!-- Diamond Setting -->
    <polygon points="-18,-5 18,-5 25,12 -25,12" fill="#d97706"/>
    <!-- Diamond Gemstone Facets -->
    <polygon points="-22,-5 0,-30 22,-5" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="-22,-5 -8,-5 0,-30" fill="#bae6fd" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="22,-5 8,-5 0,-30" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="-8,-5 8,-5 0,-30" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
    <!-- Ring sparkle -->
    <circle cx="0" cy="-28" r="4" fill="#ffffff"/>
  </g>

  <!-- Elegant pearls floating -->
  <circle cx="130" cy="220" r="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="105" cy="245" r="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="475" cy="225" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="500" cy="250" r="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
</svg>
